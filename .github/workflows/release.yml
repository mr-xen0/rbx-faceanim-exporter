name: Release Addon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run unit tests
        run: |
          python run_tests.py

      - name: Build addon zip
        run: |
          python build_addon.py

      - name: Create or Update Clean GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release delete "$TAG_NAME" --yes --cleanup-tag=false || true
          gh release create "$TAG_NAME" faceanim_exporter.zip --title "$TAG_NAME" --notes "First release"

