name: Release Addon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run unit tests
        run: |
          python run_tests.py

      - name: Build addon zip
        run: |
          python build_addon.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: faceanim_exporter.zip
          draft: false
          prerelease: false
          generate_release_notes: true
